
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmailJS Contact Form</title>

    <!-- EmailJS -->
    <script
        type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        form {
            width: 400px;
            max-width: 100%;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<form id="contact-form">

    <h2>Contact Us</h2>

    <label>Name</label>
    <input
        type="text"
        name="name"
        placeholder="Enter your name"
        required
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label>Phone</label>
    <input
        type="tel"
        name="phone"
        placeholder="Enter your phone number"
        required
    >

    <label>Address</label>
    <input
        type="text"
        name="address"
        placeholder="Enter your address"
        required
    >

    <label>Message</label>
    <textarea
        name="message"
        placeholder="Enter your message"
        required
    ></textarea>

    <button type="submit" id="submit-btn">
        Send Message
    </button>

</form>

<script>

    // Initialize EmailJS
    emailjs.init({
        publicKey: "tzxkhn_dLAxCh6Xu2"
    });

    // Get form
    const form = document.getElementById("contact-form");

    // Submit form
    form.addEventListener("submit", function(event) {

        // Stop page refresh
        event.preventDefault();

        console.log("Form submitted...");

        // Send form data using EmailJS
        emailjs.sendForm(
            "service_g90n0l6",
            "template_eoncr07",
            form
        )
        .then(function(response) {

            console.log(
                "SUCCESS!",
                response.status,
                response.text
            );

            alert("Message sent successfully!");

            // Clear form
            form.reset();

        })
        .catch(function(error) {

            console.error("FAILED...", error);

            alert("Failed to send message. Check the console.");

        });

    });

</script>

</body>

</html>
